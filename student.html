<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>数学・神経衰弱</title>
<style>
body{font-family:system-ui,"Noto Sans JP",sans-serif;background:#f4f6fa;margin:0;color:#172033}header{background:#183b78;color:white;text-align:center;padding:16px}main{max-width:1100px;margin:auto;padding:16px}.panel{background:white;border-radius:14px;padding:16px;box-shadow:0 4px 16px #0001}.status{display:flex;gap:22px;flex-wrap:wrap;font-weight:700;margin-bottom:14px}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{aspect-ratio:1.5/1}.card button{width:100%;height:100%;border:3px solid #cbd5e1;border-radius:14px;background:white;font-size:clamp(17px,2.5vw,28px);font-weight:700;cursor:pointer}.selected button{border-color:#2563eb;background:#dbeafe}.done button{background:#dcfce7;border-color:#22c55e;color:#166534}.wrong button{animation:shake .25s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.center{text-align:center}.message{text-align:center;min-height:30px;font-weight:700;margin:10px}#confirm{padding:12px 28px;background:#16a34a;color:white;border:0;border-radius:9px;font-size:18px;font-weight:700;cursor:pointer}#confirm:disabled{opacity:.5}.error{text-align:center;color:#b91c1c;font-weight:700}@media(max-width:700px){#board{grid-template-columns:repeat(3,1fr)}}@media(max-width:450px){#board{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><h1>数学・神経衰弱</h1></header><main><section class="panel"><div id="status"></div><div id="board"></div><div id="message" class="message">札を2枚選んでください。</div><div class="center"><button id="confirm" disabled>この2枚で一致！</button></div><div id="error" class="error"></div></section></main>
<script>
let pairs=[],cards=[],sel=[],lock=false,score=0,moves=0,sec=0,timer=null,started=false;
const $=x=>document.getElementById(x);
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function timerStart(){if(started)return;started=true;timer=setInterval(()=>{$('time').textContent=String(Math.floor(++sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')},1000)}
function init(){try{pairs=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))))}catch(e){$('error').textContent='先生から配布されたQRコードからアクセスしてください。';return}if(!Array.isArray(pairs)||pairs.length<2){$('error').textContent='問題データがありません。';return}pairs.forEach((p,i)=>{cards.push({text:p[0],pair:i,done:false});cards.push({text:p[1],pair:i,done:false})});shuffle(cards);$('status').innerHTML='<div class="status"><span>正解：<b id="score">0</b> / '+pairs.length+'</span><span>手数：<b id="moves">0</b></span><span>時間：<b id="time">00:00</b></span></div>';render();$('confirm').onclick=confirmPair}
function render(){const b=$('board');b.innerHTML='';cards.forEach((c,i)=>{const d=document.createElement('div');d.className='card'+(c.done?' done':'');d.innerHTML='<button>'+esc(c.text)+'</button>';d.onclick=()=>choose(i,d);b.appendChild(d)})}
function choose(i,d){if(lock||cards[i].done)return;let k=sel.indexOf(i);if(k>=0){sel.splice(k,1);d.classList.remove('selected');update();return}if(sel.length>=2)return;timerStart();sel.push(i);d.classList.add('selected');update()}
function update(){$('confirm').disabled=sel.length!==2;$('message').textContent=sel.length===2?'この2枚でよいと思ったら「一致！」を押してください。':'札を2枚選んでください。'}
function confirmPair(){if(lock||sel.length!==2)return;lock=true;$('confirm').disabled=true;moves++;$('moves').textContent=moves;let[a,b]=sel,es=[...document.querySelectorAll('.card')];if(cards[a].pair===cards[b].pair){cards[a].done=cards[b].done=true;es[a].classList.remove('selected');es[b].classList.remove('selected');es[a].classList.add('done');es[b].classList.add('done');$('score').textContent=++score;$('message').textContent='正解！';sel=[];lock=false;if(score===pairs.length){clearInterval(timer);setTimeout(()=>alert('クリア！\n手数：'+moves+'回\n時間：'+$('time').textContent),200)}}else{$('message').textContent='不正解。もう一度考えてみよう！';es[a].classList.add('wrong');es[b].classList.add('wrong');setTimeout(()=>{es[a].classList.remove('selected','wrong');es[b].classList.remove('selected','wrong');sel=[];lock=false;update()},700)}}init();
</script></body></html>
